[project]
name = "helpagent"
version = "0.1.0"
description = "Small-model coding harness: kernel envelopes, task tree, fake model layer"
requires-python = ">=3.12"
dependencies = [
    "mypy>=2.3.1",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
]

[tool.pytest.ini_options]
# Unit gate = unit + contract, a couple of minutes, CPU-only; tests/fixtures/ holds
# shared fixture repos consumed by scenarios, not gate tests themselves.
testpaths = ["tests/unit", "tests/contract"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "slow: real-server integration tests (llama.cpp :8833); run with pytest tests/integration -m slow",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
